name: Notify Illegal Studio pacman

on:
  workflow_call:
    inputs:
      tag:
        required: true
        type: string
    secrets:
      ILLEGAL_BOT_APP_ID:
        required: true
      ILLEGAL_BOT_PRIVATE_KEY:
        required: true
  workflow_dispatch:
    inputs:
      tag:
        description: 'Latest published release tag to synchronize, for example v1.0.0'
        required: true
        type: string

permissions:
  contents: read

jobs:
  notify:
    runs-on: ubuntu-22.04
    steps:
      - name: Require the latest complete public release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.tag }}
        run: |
          [[ "$RELEASE_TAG" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]
          latest=$(gh api repos/illegalstudio/context/releases/latest --jq .tag_name)
          [[ "$RELEASE_TAG" == "$latest" ]] || { echo 'Only the latest public release can be synchronized'; exit 1; }
          assets=$(gh release view "$RELEASE_TAG" --repo illegalstudio/context --json assets --jq '.assets[].name')
          for arch in x86_64 aarch64; do
            grep -Fxq "context-${RELEASE_TAG#v}-1-$arch.pkg.tar.zst" <<< "$assets"
          done
      - name: Create Illegal Bot pacman token
        id: token
        uses: actions/create-github-app-token@fee1f7d63c2ff003460e3d139729b119787bc349
        with:
          app-id: ${{ secrets.ILLEGAL_BOT_APP_ID }}
          private-key: ${{ secrets.ILLEGAL_BOT_PRIVATE_KEY }}
          owner: illegalstudio
          repositories: pacman
      - name: Dispatch package synchronization
        env:
          GH_TOKEN: ${{ steps.token.outputs.token }}
        run: |
          gh api repos/illegalstudio/pacman/dispatches \
            -f event_type=publish \
            -f 'client_payload[repo]=illegalstudio/context'
