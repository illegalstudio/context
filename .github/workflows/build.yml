name: Check and package all platforms

on:
  workflow_call:
    inputs:
      release-tag:
        type: string
        default: ''
      source-commit:
        type: string
        default: ''
    secrets:
      APPLE_CERTIFICATE_P12:
        required: false
      APPLE_CERTIFICATE_PASSWORD:
        required: false
      APPLE_SIGNING_IDENTITY:
        required: false
      APPLE_ID:
        required: false
      APPLE_TEAM_ID:
        required: false
      APPLE_APP_PASSWORD:
        required: false

permissions:
  contents: read

jobs:
  check:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
          - runner: ubuntu-22.04-arm
            target: aarch64-unknown-linux-gnu
          - runner: macos-15
            target: aarch64-apple-darwin
    runs-on: ${{ matrix.runner }}
    env:
      MACOSX_DEPLOYMENT_TARGET: '11.0'
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.source-commit || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.14'
      - name: Install Rust
        run: |
          rustup toolchain install stable --profile minimal --component rustfmt --component clippy --component rust-docs
          rustup default stable
      - name: Check release tag
        if: inputs.release-tag != ''
        env:
          RELEASE_TAG: ${{ inputs.release-tag }}
        run: python3 scripts/release.py --check-tag "$RELEASE_TAG"
      - name: Check formatting, lint and tests
        run: make check
      - name: Evaluate selection on pinned historical tasks
        run: cargo run --locked -- evaluate tests/fixtures/evaluation-history.json --max-files 15 --min-recall 1
      - name: Build binary
        run: make build
      - name: Sign macOS release binary
        if: inputs.release-tag != '' && runner.os == 'macOS'
        env:
          APPLE_CERTIFICATE_P12: ${{ secrets.APPLE_CERTIFICATE_P12 }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
        run: bash scripts/notarize.sh sign
      - name: Package binary and licenses
        env:
          PACKAGE_TARGET: ${{ matrix.target }}
        run: python3 scripts/package.py --target "$PACKAGE_TARGET"
      - name: Notarize macOS release package
        if: inputs.release-tag != '' && runner.os == 'macOS'
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
        run: bash scripts/notarize.sh submit
      - uses: actions/upload-artifact@v7
        with:
          name: context-${{ matrix.target }}
          path: dist/*
          if-no-files-found: error

  minimum-rust:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.source-commit || github.sha }}
          persist-credentials: false
      - name: Check minimum supported Rust
        run: |
          rustup toolchain install 1.90.0 --profile minimal
          cargo +1.90.0 check --all-targets --locked
