[package]
name = "context-cli"
version = "0.3.0"
edition = "2024"
rust-version = "1.90"
description = "Deterministic, explainable context packs for coding tasks"
license = "MIT"
repository = "https://github.com/illegalstudio/context"
readme = "README.md"
default-run = "context"
include = [
    "/Cargo.toml", "/Cargo.lock", "/README.md", "/LICENSE", "/src/*.rs", "/resources/*.json",
    "/docs/*", "/licenses/**", "/scripts/*.py", "/scripts/*.sh", "/packaging/**", "/Makefile",
    "/tests/regression.rs", "/tests/test_*.py", "/tests/fixtures/**",
    "/tests/codebases/**/*.ts", "/tests/codebases/**/*.tsx", "/tests/codebases/**/*.php",
    "/tests/codebases/**/*.py", "/tests/codebases/**/package.json", "/tests/codebases/**/composer.json",
    "/tests/codebases/**/tsconfig.json", "/tests/codebases/**/.ctxignore", "/tests/codebases/**/requirements.txt",
]

[lib]
name = "context"

[[bin]]
name = "context"
path = "src/main.rs"

[dependencies]
anyhow = "1"
blake3 = "1"
chrono = { version = "0.4", features = ["serde"] }
clap = { version = "4", features = ["derive", "env"] }
flate2 = "1"
ignore = "0.4"
open = "5"
rayon = "1"
regex = "1"
rusqlite = { version = "0.40", features = ["bundled"] }
rust-stemmers = "1"
rustyline = "17"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tar = "0.4"
tree-sitter = "0.27"
tree-sitter-go = "0.25"
tree-sitter-java = "0.23"
tree-sitter-javascript = "0.25"
tree-sitter-php = "0.25"
tree-sitter-python = "0.25"
tree-sitter-ruby = "0.23"
tree-sitter-rust = "0.24"
tree-sitter-typescript = "0.23"

[dev-dependencies]
tempfile = "3"

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
